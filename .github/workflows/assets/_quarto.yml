project:
  type: website
  render:
    - index.qmd
  # Quarto copies only these globs, plus files it finds behind an `href` or a
  # `src` in the rendered HTML. The manifest names its icons in JSON, which is
  # not scanned, so they are listed here.
  resources:
    - .nojekyll
    - CNAME
    - /favicon.ico
    - /site.webmanifest
    - /assets/images/icon-*.png
format: mickaelcanouilfr-html
website:
  title: "GitHub Profile"
  description: "A landing page for Mickaël CANOUIL GitHub profile."
  favicon: favicon.ico
  image: assets/images/og-image.png
  site-url: &site-url https://m.canouil.dev
  open-graph: true
  twitter-card: true
  page-footer:
    border: false
    left: |
      Powered by [{{< iconify simple-icons:quarto aria-hidden=true >}} Quarto](https://quarto.org){target="_blank" rel="noopener noreferrer"}.
    center: |
      &copy; []{#current-year} [Mickaël CANOUIL](https://mickael.canouil.fr){target="_blank" rel="noopener noreferrer"}. [{{< iconify octicon:heart-fill-16 aria-hidden=true >}} Sponsor](https://github.com/sponsors/mcanouil?o=esb){target="_blank" rel="noopener noreferrer"}.
    right: |
      License: [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0){target="_blank" rel="noopener noreferrer"}.

# Quarto keeps the `website` block out of the metadata it hands to Lua
# filters, so `social-metadata.lua` cannot read `website.site-url` to build
# `og:url`. The anchor above republishes the same scalar here, without a
# second copy of the string. The remaining keys are the head links Quarto
# has no configuration for; `website.favicon` still emits the `.ico` one.
extensions:
  mickaelcanouilfr:
    site-url: *site-url
    icon: assets/images/icon.svg
    apple-touch-icon: assets/images/apple-touch-icon.png
    manifest: site.webmanifest
    theme-color:
      light: "#fafafa"
      dark: "#161616"
