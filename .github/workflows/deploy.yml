name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release
          tinytex: false

      - name: Render Quarto Project
        shell: bash
        run: |
          gh auth setup-git
          git clone --no-checkout --depth 1 --filter=blob:none \
            "https://github.com/mcanouil/mickael.canouil.fr.git" upstream
          git -C upstream sparse-checkout init --cone
          git -C upstream sparse-checkout set \
            assets/images \
            _includes \
            _extensions/mickaelcanouilfr \
            _extensions/mcanouil
          git -C upstream checkout

          cp upstream/_profile.qmd index.qmd
          mkdir -p assets/images _extensions
          cp -R upstream/_includes _includes
          cp upstream/assets/images/profile.png upstream/assets/images/social-profile.png assets/images/
          cp upstream/assets/images/icon.svg upstream/assets/images/apple-touch-icon.png \
            upstream/assets/images/icon-192.png upstream/assets/images/icon-512.png assets/images/
          cp upstream/favicon.ico favicon.ico
          cp -R upstream/_extensions/mickaelcanouilfr _extensions/
          cp -R upstream/_extensions/mcanouil _extensions/
          rm -rf upstream

          sed -i 's|  links:|  links:\n    - text: '\''{{< iconify octicon:home-fill-16 title="mickael.canouil.fr" label="mickael.canouil.fr" >}}'\''\n      href: "https://mickael.canouil.fr/"\n      target: "_blank"\n      rel: "noopener noreferrer"\n      aria-label: "home logo for personal website"|' index.qmd

          touch .nojekyll
          echo "m.canouil.dev" > CNAME
          cp .github/workflows/assets/_quarto.yml _quarto.yml
          cp .github/workflows/assets/site.webmanifest site.webmanifest

          quarto render

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
